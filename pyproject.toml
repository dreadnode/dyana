[project]
name = "dyana"
version = "0.1.4"
description = "A sandbox environment based on Docker and eBPF to load and profile a wide range of file types."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Simone Margaritelli", email = "simone@dreadnode.io" },
    { name = "Ads Dawson", email = "ads@dreadnode.io" },
]
dependencies = [
    "typer>=0.24.1,<0.25",
    "pydantic>=2.9.2,<3",
    "docker>=7.1.0,<8",
    "rich>=14.0.0,<15",
    "pydantic-yaml>=1.4.0,<2",
]

[project.urls]
Repository = "https://github.com/dreadnode/dyana"

[project.optional-dependencies]
fast-json = ["cysimdjson==24.12; platform_system == 'Linux' and platform_machine == 'x86_64'"]

[project.scripts]
dyana = "dyana.__main__:run"

[dependency-groups]
dev = [
    "mypy>=1.8.0,<2",
    "ruff>=0.15.0,<0.16",
    "pre-commit>=4.0.0,<5",
    "pytest>=9.0.0,<10",
    "pytest-asyncio>=1.0.0,<2",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.6.1,<10",
    "mkdocs-section-index>=0.3.9,<0.4",
    "pymdown-extensions>=10.15,<11",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dyana"]

[tool.uv]
exclude-newer = "3 days"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "torch.*"
disallow_untyped_calls = false

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py310"
exclude = [
    ".git",
    ".git-rewrite",
    ".mypy_cache",
    ".ruff_cache",
    "__pypackages__",
    "build",
    "dist",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "C",
    "B",
    "UP",
    "NPY",
    "A",
]
ignore = [
    "E501",
    "B008",
    "C901",
    "W191",
    "F722",
    "A001",
    "A002",
]
fixable = ["ALL"]
unfixable = ["B"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
